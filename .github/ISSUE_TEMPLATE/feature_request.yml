name: Feature request
description: Suggest something Casement could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the existing issues first. Casement keeps to a few rules: nothing polls while idle, and every new permission sits behind an opt-in setting. Ideas that fit them are the easiest to take on.

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or situation, in your own words.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Casement to do
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Another app, a script, or nothing.

  - type: input
    id: casement-version
    attributes:
      label: Casement version
      description: "*Settings → About*, or `casementctl health`."

  - type: input
    id: macos-version
    attributes:
      label: macOS version

  - type: input
    id: mac-model
    attributes:
      label: Mac model, and whether it has a notch

  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: If it matters for the idea, which displays you use.
