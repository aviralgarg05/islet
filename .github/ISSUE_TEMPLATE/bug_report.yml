name: Bug report
description: Something in Islet doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the existing issues first.
        Remove anything personal (names, addresses, messages, tokens, keys) from text, output and screenshots before you submit.
        Security problems go through private reporting instead: see [SECURITY.md](https://github.com/aviralgarg05/islet/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Screenshots or a screen recording help with anything visual.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: islet-version
    attributes:
      label: Islet version
      description: "*Settings → About*, or `isletctl health`."
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "Apple menu → *About This Mac*."
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: "Apple menu → *About This Mac*."
    validations:
      required: true

  - type: dropdown
    id: notch
    attributes:
      label: Does the built-in display have a notch?
      options:
        - "Yes"
        - "No"
        - "No built-in display, or the lid was closed"
    validations:
      required: true

  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: Which displays were connected, and which one the island was on.

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: "The settings involved, or the relevant part of `~/.config/islet/config.json`."

  - type: textarea
    id: menubar-debug
    attributes:
      label: Menu bar debug output (Live Activity problems only)
      description: "Run `isletctl debug menubar` while the activity shows in the menu bar and paste the output. Remove personal text first."
      render: json
