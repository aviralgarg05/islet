name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a run can be started by hand from the Actions tab, to re-check a flake or a runner change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skipped while the repository is private, where macOS runner minutes are limited.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Islet builds with the macOS 26 SDK (Xcode 26, Swift 6.3) and later; macOS 27-only code is
      # compiled in only with the macOS 27 SDK. Use the newest release Xcode on the runner.
      - name: Select the newest Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          swift --version
          sdk="$(xcrun --show-sdk-version)"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::Islet needs the macOS 26 SDK or later; the newest Xcode here has $sdk."; exit 1; }
          echo "toolchain=$(swift --version 2>/dev/null | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          # Islet has no dependencies yet, so there is no Package.resolved; Package.swift stands in.
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # Through the Makefile, so CI runs exactly what a contributor runs locally. It works out
      # whether this toolchain needs swift-testing's plugin path spelled out.
      - name: Build
        run: make build

      # Unit and system tests only. The end-to-end suite (make e2e) needs a logged-in GUI session.
      - name: Test
        run: make test
