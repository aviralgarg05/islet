# Home Assistant → Islet over the local-network bridge (enable it in Islet → Settings → Integrations).
# Put the bridge token in secrets.yaml as islet_token: "Bearer <token>". Copy it from Islet → Settings →
# Integrations → iPhone bridge; the local API token from `isletctl token` doesn't work here.
rest_command:
  islet_notify:
    url: "http://my-mac.local:47832/v1/notify"
    method: POST
    headers:
      Authorization: !secret islet_token
      Content-Type: application/json
    payload: '{"title": "{{ title }}", "subtitle": "{{ subtitle }}", "icon": "{{ icon | default(''sf:house.fill'') }}", "source": "home-assistant"}'

automation:
  - alias: "Doorbell → notch"
    trigger:
      - platform: state
        entity_id: binary_sensor.front_door_ding
        to: "on"
    action:
      - service: rest_command.islet_notify
        data: { title: "Doorbell", subtitle: "Someone is at the front door", icon: "sf:bell.fill" }
